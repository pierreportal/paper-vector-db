[package]
name = "toy-vector-db"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fastembed = "7.0.1"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
regex = "1.13.1"
pdf-extract = "0.12.1"
